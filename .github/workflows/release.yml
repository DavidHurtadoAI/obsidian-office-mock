name: Release theme
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check tag and theme
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync("manifest.json")).version, process.env.GITHUB_REF_NAME);'
          npm run check
          git diff --exit-code -- theme.css package-lock.json
          npm run package
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/theme.css dist/manifest.json "dist/Office-Mock-$GITHUB_REF_NAME.zip" --title "Office Mock $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
